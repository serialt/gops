services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ADDR: ":8080"
      DB_DSN: "/data/gops.db"
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRE_HOURS: "24"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      CORS_ORIGINS: "http://localhost:8088,http://localhost:5173"
    volumes:
      - sqlite_data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  sqlite_data:

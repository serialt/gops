# SQLite 数据库文件路径；生产环境建议挂载到持久化目录。
dsn: "gops.db"

log:
  file: 
  level: debug
server:
    http_port: 9876
    jwt_secret: "replace-with-a-long-random-secret"
    # 生产环境必须替换为独立、随机的 32 字节 AES-256 密钥。
    aes_key: "0123456789abcdef0123456789abcdef"
    
iot:
  enabled: true
  message_topic: "#"
  listeners:
    tcp:
      enabled: true
      address: ":1883"
    tls:
      enabled: false
      address: ":8883"
      cert_file: "certs/server.crt"
      key_file: "certs/server.key"
    websocket:
      enabled: false
      address: ":8083"
    wss:
      enabled: false
      address: ":8084"
      cert_file: "certs/server.crt"
      key_file: "certs/server.key"

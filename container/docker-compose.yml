services:
  gops:
    image: ${GOPS_IMAGE:-gin-vue:local}
    container_name: ${GOPS_CONTAINER_NAME:-gops}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GOPS_HTTP_PORT: "9876"
      GOPS_DB_DSN: /app/data/gops.db
      GOPS_LOG_LEVEL: ${GOPS_LOG_LEVEL:-info}
      GOPS_JWT_SECRET: ${GOPS_JWT_SECRET:-replace-with-a-long-random-secret}
      GOPS_AES_KEY: ${GOPS_AES_KEY:-0123456789abcdef0123456789abcdef}
      GOPS_ACCESS_TOKEN_TIMEOUT: ${GOPS_ACCESS_TOKEN_TIMEOUT:-15m}
      GOPS_REFRESH_TOKEN_TIMEOUT: ${GOPS_REFRESH_TOKEN_TIMEOUT:-168h}
      GOPS_IOT_ENABLED: ${GOPS_IOT_ENABLED:-false}
    volumes:
      - /opt/app/gops/data:/app/data
    ports:
      - "${GOPS_HTTP_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--post-data=", "http://127.0.0.1:9876/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gops-http.rule=Host(`gops.imau.cc`)"
      - "traefik.http.routers.gops-http.entrypoints=web"
      - "traefik.http.routers.gops-http.middlewares=gops-redirect"
      - "traefik.http.middlewares.gops-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gops-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.gops.rule=Host(`gops.imau.cc`)"
      - "traefik.http.routers.gops.entrypoints=websecure"
      - "traefik.http.routers.gops.tls=true"
      - "traefik.http.services.gops.loadbalancer.server.port=9876"

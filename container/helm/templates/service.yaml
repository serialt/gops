apiVersion: v1
kind: Service
metadata:
  name: {{ include "gops.fullname" . }}
  labels:
    {{- include "gops.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gops.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.iot.enabled }}
    - name: mqtt
      port: {{ .Values.iot.port }}
      targetPort: mqtt
      protocol: TCP
    {{- end }}

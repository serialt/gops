{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gops.fullname" . }}
  labels:
    {{- include "gops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.jwtSecretKey }}: {{ required "config.jwtSecret is required" .Values.config.jwtSecret | quote }}
  {{ .Values.config.aesKeyKey }}: {{ required "config.aesKey is required" .Values.config.aesKey | quote }}
{{- end }}

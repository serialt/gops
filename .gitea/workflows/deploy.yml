name: Build and deploy container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gin-vue-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPS_JWT_SECRET: ${{ secrets.GOPS_JWT_SECRET }}
      GOPS_AES_KEY: ${{ secrets.GOPS_AES_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare image tag
        shell: sh
        env:
          RAW_BRANCH: ${{ gitea.ref_name }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          set -eu
          safe_branch="$(printf '%s' "$RAW_BRANCH" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          test -n "$safe_branch"
          test -n "$COMMIT_SHA"
          printf 'GOPS_IMAGE=gin-vue:%s-%s\n' "$safe_branch" "$COMMIT_SHA" >> "$GITHUB_ENV"


      - name: Build image
        run: |
          podman build --pull --tag "$GOPS_IMAGE" --file Dockerfile .
          podman image exists "$GOPS_IMAGE"

      - name: Start service
        run: |
          podman compose up -d --no-build --remove-orphans gops

      - name: Wait for health check
        run: |
          container_name="${GOPS_CONTAINER_NAME:-gops}"
          container_id="$(podman container inspect --format '{{.Id}}' "$container_name")"
          test -n "$container_id"
          for attempt in $(seq 1 36); do
            status="$(podman inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              podman compose ps
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              podman compose logs gops
              exit 1
            fi
            sleep 5
          done
          podman compose logs gops
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          podman compose logs --tail=200 gops || true

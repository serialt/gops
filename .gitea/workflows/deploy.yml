name: Build and deploy container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gin-vue-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALI_ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
      ALI_ACR_USERNAME: serialt
      GOPS_JWT_SECRET: ${{ secrets.GOPS_JWT_SECRET }}
      GOPS_AES_KEY: ${{ secrets.GOPS_AES_KEY }}
      GOPS_BASE_DOCKERFILE: container/docker/Dockerfile.base
      GOPS_DOCKERFILE: container/Dockerfile
      GOPS_COMPOSE_FILE: container/docker-compose.yml
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: Set up Buildx
        run: |
          if ! docker buildx inspect gops-builder >/dev/null 2>&1; then
            docker buildx create --name gops-builder --driver docker-container
          fi
          docker buildx use gops-builder
          docker buildx inspect --bootstrap

      - name: Prepare image tag
        shell: sh
        env:
          RAW_BRANCH: ${{ gitea.ref_name }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          set -eu
          safe_branch="$(printf '%s' "$RAW_BRANCH" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          test -n "$safe_branch"
          test -n "$COMMIT_SHA"
          dependency_sha="$(sha256sum "$GOPS_BASE_DOCKERFILE" .dockerignore go.mod go.sum web/package.json web/pnpm-lock.yaml web/pnpm-workspace.yaml | awk '{print $1}' | sha256sum | awk '{print $1}')"
          test -n "$dependency_sha"
          commit_short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-12)"
          dependency_short_sha="$(printf '%s' "$dependency_sha" | cut -c1-12)"
          GOPS_IMAGE_REPOSITORY="$ALI_ACR_REGISTRY/$ALI_ACR_USERNAME/gops"
          GOPS_BASE_IMAGE_REPOSITORY="$ALI_ACR_REGISTRY/$ALI_ACR_USERNAME/gops-base"
          printf 'GOPS_IMAGE_REPOSITORY=%s\n' "$GOPS_IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          printf 'GOPS_IMAGE=%s:%s-%s\n' "$GOPS_IMAGE_REPOSITORY" "$safe_branch" "$commit_short_sha" >> "$GITHUB_ENV"
          printf 'GOPS_BASE_IMAGE=%s:%s\n' "$GOPS_BASE_IMAGE_REPOSITORY" "$dependency_short_sha" >> "$GITHUB_ENV"
          printf 'GOPS_BASE_CACHE_IMAGE=%s:buildcache\n' "$GOPS_BASE_IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          printf 'GOPS_CACHE_IMAGE=%s:buildcache\n' "$GOPS_IMAGE_REPOSITORY" >> "$GITHUB_ENV"

      - name: Login to Aliyun Container Registry
        shell: sh
        env:
          ALI_ACR_PASSWORD: ${{ secrets.ALI_ACR_PASSWORD }}
        run: |
          set -eu
          test -n "$ALI_ACR_PASSWORD"
          printf '%s' "$ALI_ACR_PASSWORD" | docker login --username "$ALI_ACR_USERNAME" --password-stdin "$ALI_ACR_REGISTRY"

      - name: Prepare base image
        shell: sh
        run: |
          set -eu
          test -f "$GOPS_BASE_DOCKERFILE"
          if docker manifest inspect "$GOPS_BASE_IMAGE" >/dev/null 2>&1; then
            echo "Base image exists: $GOPS_BASE_IMAGE"
            docker pull "$GOPS_BASE_IMAGE"
          else
            echo "Base image not found, building: $GOPS_BASE_IMAGE"
            docker buildx build \
              --pull \
              --file "$GOPS_BASE_DOCKERFILE" \
              --tag "$GOPS_BASE_IMAGE" \
              --cache-from "type=registry,ref=$GOPS_BASE_CACHE_IMAGE" \
              --cache-to "type=registry,ref=$GOPS_BASE_CACHE_IMAGE,mode=max" \
              --push .
          fi

      - name: Build image
        shell: sh
        run: |
          set -eu
          test -f "$GOPS_DOCKERFILE"
          docker buildx build \
            --pull \
            --build-arg "GOPS_BASE_IMAGE=$GOPS_BASE_IMAGE" \
            --tag "$GOPS_IMAGE" \
            --file "$GOPS_DOCKERFILE" \
            --cache-from "type=registry,ref=$GOPS_CACHE_IMAGE" \
            --cache-to "type=registry,ref=$GOPS_CACHE_IMAGE,mode=max" \
            --push .

      # - name: Start service
      #   shell: sh
      #   run: |
      #     set -eu
      #     test -f "$GOPS_COMPOSE_FILE"
      #     docker compose --file "$GOPS_COMPOSE_FILE" config --quiet
      #     docker pull "$GOPS_IMAGE"
      #     docker compose --file "$GOPS_COMPOSE_FILE" up -d --force-recreate --no-build --remove-orphans --wait --wait-timeout 180 gops
      #     docker compose --file "$GOPS_COMPOSE_FILE" ps


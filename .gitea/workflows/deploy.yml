name: Build and deploy container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gin-vue-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALI_ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
      ALI_ACR_USERNAME: serialt
      GOPS_JWT_SECRET: ${{ secrets.GOPS_JWT_SECRET }}
      GOPS_AES_KEY: ${{ secrets.GOPS_AES_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare image tag
        shell: sh
        env:
          RAW_BRANCH: ${{ gitea.ref_name }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          set -eu
          safe_branch="$(printf '%s' "$RAW_BRANCH" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          test -n "$safe_branch"
          test -n "$COMMIT_SHA"
          dependency_sha="$(sha256sum go.mod go.sum web/package.json web/pnpm-lock.yaml web/pnpm-workspace.yaml | awk '{print $1}' | sha256sum | awk '{print $1}')"
          test -n "$dependency_sha"
          GOPS_IMAGE_REPOSITORY="$ALI_ACR_REGISTRY/$ALI_ACR_USERNAME/gops"
          GOPS_BASE_IMAGE_REPOSITORY="$ALI_ACR_REGISTRY/$ALI_ACR_USERNAME/gops-base"
          printf 'GOPS_IMAGE_REPOSITORY=%s\n' "$GOPS_IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          printf 'GOPS_BASE_IMAGE_REPOSITORY=%s\n' "$GOPS_BASE_IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          printf 'GOPS_IMAGE=%s:%s-%s\n' "$GOPS_IMAGE_REPOSITORY" "$safe_branch" "$COMMIT_SHA" >> "$GITHUB_ENV"
          printf 'GOPS_BASE_IMAGE=%s:%s\n' "$GOPS_BASE_IMAGE_REPOSITORY" "$dependency_sha" >> "$GITHUB_ENV"

      - name: Login to Aliyun Container Registry
        shell: sh
        env:
          ALI_ACR_PASSWORD: ${{ secrets.ALI_ACR_PASSWORD }}
        run: |
          set -eu
          test -n "$ALI_ACR_PASSWORD"
          printf '%s' "$ALI_ACR_PASSWORD" | podman login --username "$ALI_ACR_USERNAME" --password-stdin "$ALI_ACR_REGISTRY"

      - name: Prepare base image
        shell: sh
        run: |
          set -eu
          if podman manifest inspect "$GOPS_BASE_IMAGE" >/dev/null 2>&1; then
            echo "Base image exists: $GOPS_BASE_IMAGE"
            podman pull "$GOPS_BASE_IMAGE"
          else
            echo "Base image not found, building: $GOPS_BASE_IMAGE"
            podman build --pull=missing --tag "$GOPS_BASE_IMAGE" --file docker/Dockerfile.base .
            podman image exists "$GOPS_BASE_IMAGE"
            podman push "$GOPS_BASE_IMAGE"
          fi

      - name: Build image
        shell: sh
        run: |
          set -eu
          podman build --pull=missing --build-arg "GOPS_BASE_IMAGE=$GOPS_BASE_IMAGE" --tag "$GOPS_IMAGE" --file Dockerfile .
          podman image exists "$GOPS_IMAGE"

      - name: Push image
        run: |
          podman push "$GOPS_IMAGE"

      - name: Start service
        run: |
          podman compose up -d --no-build --remove-orphans gops

      - name: Wait for health check
        run: |
          container_name="${GOPS_CONTAINER_NAME:-gops}"
          container_id="$(podman container inspect --format '{{.Id}}' "$container_name")"
          test -n "$container_id"
          for attempt in $(seq 1 36); do
            status="$(podman inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              podman compose ps
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              podman compose logs gops
              exit 1
            fi
            sleep 5
          done
          podman compose logs gops
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          podman compose logs --tail=200 gops || true

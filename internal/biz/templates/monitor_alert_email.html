<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
</head>

<body
    style="margin:0;padding:24px;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
            <td align="center">
                <table role="presentation" width="520" cellspacing="0" cellpadding="0" border="0"
                    style="max-width:100%;background:#fff;border:1px solid #e5e9f2;border-radius:12px;">
                    <tr>
                        <td style="padding:28px 32px;">
                            <div style="font-size:18px;font-weight:700;line-height:1.5;text-align:center;">{{.Title}}
                            </div>
                            <div
                                style="height:3px;width:42px;margin:16px auto 20px;background:#536fe8;border-radius:2px;">
                            </div>
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                style="background:#f7f8fc;border:1px solid #edf0f6;border-radius:8px;color:#344054;font-size:14px;line-height:1.7;">
                                <tr>
                                    <td style="padding:14px 16px 4px;color:#667085;font-size:12px;">监控对象</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 12px;font-weight:600;word-break:break-word;">{{.Target}}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 4px;color:#667085;font-size:12px;">告警类型</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 12px;font-weight:600;">{{.AlertType}}</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 4px;color:#667085;font-size:12px;">告警详情</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 12px;white-space:pre-wrap;word-break:break-word;">
                                        {{.Message}}</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 14px;color:#667085;font-size:12px;">发生时间：{{.OccurredAt}}
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:20px 0 0;color:#667085;font-size:12px;line-height:1.7;text-align:center;">
                                此邮件由监控系统自动发送，请勿直接回复。</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>

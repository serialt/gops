<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#172033;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr><td align="center">
      <table role="presentation" width="520" cellspacing="0" cellpadding="0" border="0" style="max-width:100%;background:#fff;border:1px solid #e5e9f2;border-radius:12px;">
        <tr><td style="padding:28px 32px;">
          <div style="font-size:18px;font-weight:700;line-height:1.5;text-align:center;">{{.Title}}</div>
          <p style="margin:12px 0 20px;color:#667085;font-size:14px;line-height:1.7;text-align:center;">您正在进行身份验证，请使用以下验证码完成操作。</p>
          <div style="box-sizing:border-box;width:240px;max-width:100%;margin:0 auto;padding:14px 12px;text-align:center;background:#f1f4ff;border-radius:8px;color:#536fe8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:8px;">{{.Code}}</div>
          <p style="margin:20px 0 0;color:#667085;font-size:13px;line-height:1.7;text-align:center;">验证码 {{.ExpireMinutes}} 分钟内有效，请勿泄露给他人。如非本人操作，请忽略此邮件。</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>__SYSTEM_NAME__ · Service running</title>
  <style>
    :root {
      color: #182235;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background: #fff;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(520px, 1.15fr) minmax(420px, .85fr);
      min-height: 100vh;
      overflow: hidden;
      background-color: #fff;
      background-image: url('/__fallback/bg.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .visual {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .illustration {
      position: absolute;
      left: 10%;
      bottom: 15%;
      width: min(80%, 680px);
      max-height: 58%;
      object-fit: contain;
      object-position: left bottom;
    }

    .panel {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #fff;
    }

    .content {
      width: min(360px, 100%);
    }

    .heading {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 32px;
    }

    .logo {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(48, 73, 180, .26);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: #98a2b3;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
        background-image: none;
      }

      .visual {
        display: none;
      }

      .panel {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="visual" aria-hidden="true">
      <img class="illustration" src="/__fallback/illustration.svg" alt="">
    </section>
    <section class="panel">
      <div class="content">
        <div class="heading">
          <img class="logo" src="/__fallback/gops.svg" alt="__SYSTEM_NAME__">
          <div>
            <h1>Service running</h1>
            <p class="subtitle">__SYSTEM_NAME__ backend service is running.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
